# Musubi Tuner v0.3.4 context, pinned by install-musubi.ps1.
# Use only the trainable FLUX.2 Klein Base 9B BF16 checkpoint. The distilled
# Klein 9B inference checkpoint and GGUF quantizations are not training bases.
# Latents and text-encoder outputs are cached first by the dedicated
# flux_2_cache_latents.py and flux_2_cache_text_encoder_outputs.py commands.

dataset_config = {{DATASET_CONFIG}}
dit = {{DIT}}
vae = {{VAE}}
text_encoder = {{TEXT_ENCODER}}
model_version = "klein-base-9b"
network_module = "networks.lora_flux_2"

mixed_precision = "bf16"
save_precision = "bf16"
sdpa = true
timestep_sampling = "flux2_shift"
weighting_scheme = "none"

optimizer_type = "adamw8bit"
learning_rate = 1e-4
lr_scheduler = "constant"
network_dim = 32
network_alpha = 16
max_train_epochs = 16
save_every_n_epochs = 1
save_last_n_epochs = 3
save_state = true
seed = 42

gradient_checkpointing = true
fp8_base = true
fp8_scaled = true
fp8_text_encoder = true
blocks_to_swap = 16
block_swap_h2d_only = true
block_swap_ring_size = 1
max_data_loader_n_workers = 2
persistent_data_loader_workers = true

output_dir = {{OUTPUT_DIR}}
output_name = {{OUTPUT_NAME}}
training_comment = {{TRIGGER_TOKEN}}
