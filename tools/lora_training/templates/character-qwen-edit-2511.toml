# Musubi Tuner v0.3.4 context, pinned by install-musubi.ps1.
# Use the trainable Qwen-Image-Edit-2511 BF16 .safetensors checkpoint. GGUF
# Q4_K_M and other inference quantizations are not training bases.
# Latents and text-encoder outputs are cached first by the dedicated
# qwen_image_cache_latents.py and qwen_image_cache_text_encoder_outputs.py
# commands. dataset.toml supplies the required paired control_directory.

dataset_config = {{DATASET_CONFIG}}
dit = {{DIT}}
vae = {{VAE}}
text_encoder = {{TEXT_ENCODER}}
model_version = "edit-2511"
network_module = "networks.lora_qwen_image"

mixed_precision = "bf16"
save_precision = "bf16"
sdpa = true
timestep_sampling = "qwen_shift"
weighting_scheme = "none"

optimizer_type = "adamw8bit"
learning_rate = 5e-5
lr_scheduler = "constant"
network_dim = 16
network_alpha = 8
max_train_epochs = 16
save_every_n_epochs = 1
save_last_n_epochs = 3
save_state = true
seed = 42

gradient_checkpointing = true
fp8_base = true
fp8_scaled = true
fp8_vl = true
blocks_to_swap = 45
block_swap_h2d_only = true
block_swap_ring_size = 1
max_data_loader_n_workers = 2
persistent_data_loader_workers = true

output_dir = {{OUTPUT_DIR}}
output_name = {{OUTPUT_NAME}}
training_comment = {{TRIGGER_TOKEN}}
